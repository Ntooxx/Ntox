<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NTOX — Chat</title>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a14;--surface:#12121e;--border:#1e1e30;--text:#e0e0f0;--text-dim:#8888a0;
  --accent:#7c3aed;--accent-hover:#8b4cf7;--user-msg:#1a1a2e;--bot-msg:#12121e;
  --radius:12px;--radius-sm:8px;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border);
  flex-shrink:0;
}
header h1{font-size:16px;font-weight:600;letter-spacing:-0.3px;display:flex;align-items:center;gap:8px}
header h1 span{color:var(--accent)}
#status{font-size:12px;display:flex;align-items:center;gap:6px;color:var(--text-dim)}
#status-dot{width:8px;height:8px;border-radius:50%;background:#555;transition:background .3s}
#status-dot.connected{background:#22c55e}
#status-dot.disconnected{background:#ef4444}
#status-dot.connecting{background:#f59e0b}
#messages{
  flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px;
  scroll-behavior:smooth;
}
#messages:empty::after{
  content:"Send a message to start chatting with NTOX.";
  display:block;text-align:center;color:var(--text-dim);font-size:14px;padding:40px 0;
}
.msg{
  max-width:80%;padding:10px 14px;border-radius:var(--radius);
  line-height:1.6;font-size:14px;white-space:pre-wrap;word-break:break-word;
}
.msg.user{
  align-self:flex-end;background:var(--user-msg);border:1px solid var(--border);
  border-bottom-right-radius:var(--radius-sm);
}
.msg.bot{
  align-self:flex-start;background:var(--bot-msg);border:1px solid var(--border);
  border-bottom-left-radius:var(--radius-sm);
}
.msg.system{
  align-self:center;background:transparent;color:var(--text-dim);font-size:12px;
  max-width:100%;text-align:center;padding:4px 8px;
}
.msg .label{font-size:11px;font-weight:600;color:var(--text-dim);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.msg .label .accent{color:var(--accent)}
.msg .cursor::after{content:"|";animation:blink 1s step-end infinite;color:var(--accent)}
@keyframes blink{50%{opacity:0}}
.msg .tool-call{font-size:12px;color:var(--text-dim);margin-top:6px;font-style:italic}
.msg .error{color:#ef4444}
#input-area{
  display:flex;gap:8px;padding:12px 20px;background:var(--surface);border-top:1px solid var(--border);
  flex-shrink:0;
}
#input{
  flex:1;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:10px 14px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s;
  font-family:inherit;
}
#input:focus{border-color:var(--accent)}
#input:disabled{opacity:.5}
#send-btn{
  background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);
  padding:10px 20px;font-size:14px;font-weight:500;cursor:pointer;transition:background .2s;
  font-family:inherit;
}
#send-btn:hover:not(:disabled){background:var(--accent-hover)}
#send-btn:disabled{opacity:.5;cursor:not-allowed}
#send-btn .shortcut{font-size:11px;opacity:.7;margin-left:6px}
@media(max-width:600px){
  .msg{max-width:90%}
  #input-area{padding:10px 12px}
  #messages{padding:12px}
}
</style>
</head>
<body>
<header>
  <h1><span>NTOX</span> Chat</h1>
  <div id="status"><span id="status-dot"></span><span id="status-text">connecting...</span></div>
</header>
<div id="messages"></div>
<div id="input-area">
  <input id="input" type="text" placeholder="Type a message..." autofocus disabled>
  <button id="send-btn" disabled>Send <span class="shortcut">Enter</span></button>
</div>

<script>
(function() {
  const socket = io({ transports: ["websocket", "polling"] });
  const messagesEl = document.getElementById("messages");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send-btn");
  const statusDot = document.getElementById("status-dot");
  const statusText = document.getElementById("status-text");

  let currentMsgEl = null;
  let currentContent = "";
  let pending = false;
  let connected = false;

  function setStatus(state, text) {
    statusDot.className = state;
    statusText.textContent = text;
  }

  function addMessage(role, initialContent) {
    const el = document.createElement("div");
    el.className = `msg ${role}`;
    if (role === "bot") {
      el.innerHTML = `<div class="label"><span class="accent">NTOX</span></div><div class="content"></div>`;
      el.querySelector(".content").textContent = initialContent || "";
    } else if (role === "user") {
      el.innerHTML = `<div class="label">You</div><div class="content">${escapeHtml(initialContent || "")}</div>`;
    } else {
      el.textContent = initialContent || "";
    }
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return el;
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  function showToolCall(name) {
    if (currentMsgEl) {
      let tc = currentMsgEl.querySelector(".tool-call");
      if (!tc) {
        tc = document.createElement("div");
        tc.className = "tool-call";
        currentMsgEl.appendChild(tc);
      }
      tc.textContent = "tool: " + name;
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  }

  function showError(msg) {
    if (currentMsgEl) {
      const err = document.createElement("div");
      err.className = "error";
      err.textContent = "Error: " + msg;
      currentMsgEl.appendChild(err);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  }

  function setInputEnabled(enabled) {
    input.disabled = !enabled;
    sendBtn.disabled = !enabled;
    if (enabled) input.focus();
  }

  function sendMessage() {
    const text = input.value.trim();
    if (!text || pending || !connected) return;
    input.value = "";
    pending = true;
    setInputEnabled(false);

    addMessage("user", text);
    currentContent = "";
    currentMsgEl = addMessage("bot", "");
    const contentEl = currentMsgEl.querySelector(".content");
    contentEl.classList.add("cursor");

    socket.emit("message", text);
  }

  socket.on("connect", () => {
    connected = true;
    setStatus("connected", "connected");
    setInputEnabled(true);
  });

  socket.on("disconnect", () => {
    connected = false;
    setStatus("disconnected", "disconnected");
    setInputEnabled(false);
  });

  socket.on("connect_error", () => {
    connected = false;
    setStatus("disconnected", "connection failed");
    setInputEnabled(false);
  });

  socket.on("token", (data) => {
    if (!currentMsgEl) return;
    const contentEl = currentMsgEl.querySelector(".content");
    if (!contentEl) return;
    if (data.done) {
      contentEl.classList.remove("cursor");
      if (data.full) {
        contentEl.textContent = data.full;
        currentContent = data.full;
      }
      pending = false;
      setInputEnabled(true);
      currentMsgEl = null;
    } else {
      currentContent += data.text;
      contentEl.textContent = currentContent;
    }
    messagesEl.scrollTop = messagesEl.scrollHeight;
  });

  socket.on("error", (data) => {
    showError(data.text);
    pending = false;
    setInputEnabled(true);
    if (currentMsgEl) {
      const contentEl = currentMsgEl.querySelector(".content");
      if (contentEl) contentEl.classList.remove("cursor");
      currentMsgEl = null;
    }
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener("click", sendMessage);

  setStatus("connecting", "connecting...");
})();
</script>
</body>
</html>
