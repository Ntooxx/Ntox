<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NTOX</title>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  color-scheme:light;
  --bg:#f7f7f4;
  --panel:#ffffff;
  --panel-soft:#f0f0ec;
  --text:#171717;
  --muted:#6b6b63;
  --faint:#9b9b93;
  --line:#deded7;
  --line-strong:#c9c9c0;
  --accent:#0f766e;
  --accent-strong:#115e59;
  --user:#e7f4f1;
  --assistant:#ffffff;
  --danger:#b42318;
  --ok:#16794c;
  --shadow:0 20px 70px rgba(26,28,24,.12);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#151613;
  --panel:#1f201c;
  --panel-soft:#292a25;
  --text:#f1f1ea;
  --muted:#aaa99f;
  --faint:#77766d;
  --line:#35362f;
  --line-strong:#4b4c42;
  --accent:#5eead4;
  --accent-strong:#99f6e4;
  --user:#173b36;
  --assistant:#1f201c;
  --danger:#f97066;
  --ok:#6ce9a6;
  --shadow:0 24px 80px rgba(0,0,0,.28);
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);overflow:hidden}
button,textarea{font:inherit}
button{border:0;cursor:pointer}
.app{height:100vh;display:grid;grid-template-columns:280px minmax(0,1fr)}
.side{
  border-right:1px solid var(--line);
  background:var(--panel-soft);
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:14px;
  min-width:0;
}
.brand{display:flex;align-items:center;gap:10px;height:36px}
.mark{
  width:28px;height:28px;border-radius:8px;background:var(--text);color:var(--bg);
  display:grid;place-items:center;font-weight:760;font-size:13px;letter-spacing:0;
}
.brand h1{font-size:15px;line-height:1;margin:0;font-weight:720;letter-spacing:0}
.brand span{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:3px}
.new-chat{
  height:38px;border:1px solid var(--line-strong);border-radius:8px;background:var(--panel);color:var(--text);
  display:flex;align-items:center;justify-content:center;gap:8px;font-weight:650;
}
.new-chat:hover{border-color:var(--accent);color:var(--accent-strong)}
.section-title{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;margin:8px 0 2px}
.stat-list{display:grid;gap:8px}
.stat{
  border:1px solid var(--line);border-radius:8px;background:color-mix(in srgb,var(--panel) 70%,transparent);
  padding:9px 10px;min-width:0;
}
.stat label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.stat strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.activity{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:7px;padding-right:2px}
.event{
  border:1px solid var(--line);border-radius:8px;padding:8px 9px;background:color-mix(in srgb,var(--panel) 78%,transparent);
  font-size:12px;color:var(--muted);line-height:1.35;
}
.event strong{color:var(--text);font-weight:650}
.event.fail strong{color:var(--danger)}
.event.ok strong{color:var(--ok)}
.side-actions{display:flex;gap:8px}
.icon-btn{
  width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--muted);
  display:grid;place-items:center;
}
.icon-btn:hover{color:var(--text);border-color:var(--line-strong)}
.main{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--bg)}
.top{
  height:57px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;background:color-mix(in srgb,var(--bg) 88%,var(--panel));
}
.top-title{display:flex;align-items:center;gap:10px;min-width:0}
.status-dot{width:8px;height:8px;border-radius:999px;background:var(--faint)}
.status-dot.connected{background:var(--ok)}
.status-dot.connecting{background:#d97706}
.status-dot.disconnected{background:var(--danger)}
.top-title strong{font-size:14px}
.top-title span{font-size:12px;color:var(--muted)}
.top-actions{display:flex;align-items:center;gap:10px}
.pill{
  height:28px;border:1px solid var(--line);border-radius:999px;padding:0 10px;display:flex;align-items:center;
  color:var(--muted);font-size:12px;background:var(--panel);
}
.thread{overflow:auto;padding:28px 20px 18px}
.messages{max-width:850px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.empty{min-height:calc(100vh - 220px);display:grid;align-content:center;gap:22px}
.empty h2{font-size:34px;line-height:1.08;letter-spacing:0;margin:0;font-weight:760;max-width:620px}
.empty p{font-size:15px;color:var(--muted);line-height:1.55;margin:0;max-width:590px}
.prompts{display:flex;flex-wrap:wrap;gap:8px;max-width:740px}
.prompt{
  border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:9px 11px;
  font-size:13px;box-shadow:none;
}
.prompt:hover{border-color:var(--accent);color:var(--accent-strong)}
.message{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start}
.avatar{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:720;
  background:var(--panel-soft);border:1px solid var(--line);color:var(--muted);
}
.message.user .avatar{background:var(--user);color:var(--accent-strong)}
.bubble{min-width:0}
.meta{height:20px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:3px}
.meta strong{color:var(--text);font-weight:650}
.content{
  font-size:15px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;
  padding:0;
}
.message.user .content{
  display:inline-block;background:var(--user);border:1px solid color-mix(in srgb,var(--accent) 18%,var(--line));
  padding:10px 12px;border-radius:8px;max-width:min(720px,100%);
}
.content code{
  font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace;font-size:.92em;background:var(--panel-soft);
  border:1px solid var(--line);border-radius:6px;padding:1px 4px;
}
.content pre{
  margin:12px 0;padding:13px;border:1px solid var(--line);border-radius:8px;background:var(--panel-soft);
  overflow:auto;white-space:pre;font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace;font-size:13px;line-height:1.45;
}
.cursor::after{content:"";display:inline-block;width:7px;height:16px;background:var(--accent);margin-left:3px;vertical-align:-2px;animation:blink 1s steps(2,end) infinite}
@keyframes blink{50%{opacity:0}}
.composer-wrap{border-top:1px solid var(--line);padding:14px 20px 18px;background:linear-gradient(to top,var(--bg) 88%,color-mix(in srgb,var(--bg) 70%,transparent))}
.composer{max-width:850px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end}
.input-shell{
  border:1px solid var(--line-strong);border-radius:8px;background:var(--panel);box-shadow:var(--shadow);
  display:grid;grid-template-columns:minmax(0,1fr);align-items:end;
}
textarea{
  width:100%;max-height:180px;min-height:48px;resize:none;border:0;outline:0;background:transparent;color:var(--text);
  padding:14px 15px;font-size:15px;line-height:1.4;
}
textarea::placeholder{color:var(--faint)}
.send{
  width:48px;height:48px;border-radius:8px;background:var(--text);color:var(--bg);display:grid;place-items:center;
}
.send:disabled{opacity:.35;cursor:not-allowed}
.send svg,.icon-btn svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.hint{max-width:850px;margin:8px auto 0;color:var(--faint);font-size:12px;display:flex;justify-content:space-between;gap:12px}
.mobile-menu{display:none}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;z-index:10;inset:0 auto 0 0;width:min(310px,86vw);transform:translateX(-105%);transition:transform .2s ease;box-shadow:var(--shadow)}
  .side.open{transform:translateX(0)}
  .mobile-menu{display:grid}
  .top{padding:0 12px}
  .thread{padding:22px 14px}
  .composer-wrap{padding:12px}
  .empty h2{font-size:28px}
  .pill.hide-mobile{display:none}
}
</style>
</head>
<body>
<div class="app" data-theme="light">
  <aside class="side" id="side">
    <div class="brand">
      <div class="mark">N</div>
      <div><h1>NTOX</h1><span>cognitive chat</span></div>
    </div>
    <button class="new-chat" id="new-chat" type="button">
      <span>New chat</span>
    </button>
    <div>
      <div class="section-title">Runtime</div>
      <div class="stat-list">
        <div class="stat"><label>Model</label><strong id="model">loading</strong></div>
        <div class="stat"><label>Provider</label><strong id="provider">loading</strong></div>
        <div class="stat"><label>Workspace</label><strong id="workspace">local</strong></div>
      </div>
    </div>
    <div class="section-title">Activity</div>
    <div class="activity" id="activity"></div>
    <div class="side-actions">
      <button class="icon-btn" id="theme" type="button" title="Toggle theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24"><path d="M12 3v2"/><path d="M12 19v2"/><path d="m5.6 5.6 1.4 1.4"/><path d="m17 17 1.4 1.4"/><path d="M3 12h2"/><path d="M19 12h2"/><path d="m5.6 18.4 1.4-1.4"/><path d="m17 7 1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg>
      </button>
      <button class="icon-btn" id="clear" type="button" title="Clear screen" aria-label="Clear screen">
        <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v5"/><path d="M14 11v5"/></svg>
      </button>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <div class="top-title">
        <button class="icon-btn mobile-menu" id="menu" type="button" title="Open sidebar" aria-label="Open sidebar">
          <svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg>
        </button>
        <span class="status-dot connecting" id="status-dot"></span>
        <div><strong id="status-title">Connecting</strong><br><span id="status-subtitle">local web gateway</span></div>
      </div>
      <div class="top-actions">
        <div class="pill hide-mobile" id="memory-pill">memory</div>
        <div class="pill" id="phase-pill">idle</div>
      </div>
    </header>
    <section class="thread" id="thread">
      <div class="messages" id="messages">
        <div class="empty" id="empty">
          <div>
            <h2>What should we work on?</h2>
          </div>
          <div class="prompts">
            <button class="prompt" type="button">Summarize the current repo status</button>
            <button class="prompt" type="button">Run a careful check and explain failures</button>
            <button class="prompt" type="button">What did Alive notice recently?</button>
            <button class="prompt" type="button">Plan the next NTOX improvement</button>
          </div>
        </div>
      </div>
    </section>
    <footer class="composer-wrap">
      <form class="composer" id="form">
        <div class="input-shell">
          <textarea id="input" rows="1" placeholder="Message NTOX..." disabled></textarea>
        </div>
        <button class="send" id="send" type="submit" disabled title="Send" aria-label="Send">
          <svg viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9 22 2Z"/></svg>
        </button>
      </form>
      <div class="hint"><span></span><span id="session">local session</span></div>
    </footer>
  </main>
</div>
<script>
(() => {
  const app = document.querySelector(".app");
  const socket = io({ transports: ["websocket", "polling"] });
  const messages = document.getElementById("messages");
  const empty = document.getElementById("empty");
  const thread = document.getElementById("thread");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const form = document.getElementById("form");
  const activity = document.getElementById("activity");
  const phasePill = document.getElementById("phase-pill");
  const memoryPill = document.getElementById("memory-pill");
  const statusDot = document.getElementById("status-dot");
  const statusTitle = document.getElementById("status-title");
  const statusSubtitle = document.getElementById("status-subtitle");
  const side = document.getElementById("side");
  let current = null;
  let currentText = "";
  let pending = false;

  function setStatus(kind, title, subtitle) {
    statusDot.className = "status-dot " + kind;
    statusTitle.textContent = title;
    statusSubtitle.textContent = subtitle;
  }

  function escapeHtml(text) {
    const node = document.createElement("div");
    node.textContent = text;
    return node.innerHTML;
  }

  function renderText(text) {
    const escaped = escapeHtml(text);
    const parts = escaped.split(/```/);
    return parts.map((part, index) => {
      if (index % 2 === 1) return "<pre>" + part.replace(/^[a-z0-9_-]+\n/i, "") + "</pre>";
      return part.replace(/`([^`]+)`/g, "<code>$1</code>");
    }).join("");
  }

  function scrollDown() {
    thread.scrollTop = thread.scrollHeight;
  }

  function addMessage(role, text) {
    empty?.remove();
    const wrap = document.createElement("article");
    wrap.className = "message " + role;
    const who = role === "user" ? "You" : "NTOX";
    const avatar = role === "user" ? "Y" : "N";
    wrap.innerHTML = `<div class="avatar">${avatar}</div><div class="bubble"><div class="meta"><strong>${who}</strong><span>${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</span></div><div class="content"></div></div>`;
    wrap.querySelector(".content").innerHTML = renderText(text || "");
    messages.appendChild(wrap);
    scrollDown();
    return wrap;
  }

  function setReady(ready) {
    input.disabled = !ready;
    send.disabled = !ready;
    if (ready) input.focus();
  }

  function addActivity(event, tone) {
    const row = document.createElement("div");
    row.className = "event " + (tone || "");
    row.innerHTML = event;
    activity.prepend(row);
    while (activity.children.length > 30) activity.lastElementChild.remove();
  }

  function eventLabel(event) {
    if (event.type === "phase") return `<strong>${escapeHtml(event.phase || "phase")}</strong>`;
    if (event.type === "tool_call") return `<strong>tool</strong> ${escapeHtml(event.name || "")}`;
    if (event.type === "tool_result") return `<strong>${event.success ? "tool ok" : "tool failed"}</strong> ${escapeHtml(event.name || "")}`;
    if (event.type === "memory") return `<strong>memory</strong> ${escapeHtml(event.action || "")} ${event.count || ""}`;
    if (event.type === "strategy") return `<strong>strategy</strong> ${escapeHtml(event.strategy || "")}`;
    if (event.type === "skill") return `<strong>skill</strong> ${escapeHtml(event.skillName || "")}`;
    if (event.type === "correction") return `<strong>correction</strong> ${escapeHtml(event.topicKey || "")}`;
    if (event.type === "alive") return `<strong>alive</strong> ${escapeHtml(event.action?.kind || "action")}`;
    return `<strong>event</strong> ${escapeHtml(event.type || "")}`;
  }

  function submit(text) {
    const value = (text || input.value).trim();
    if (!value || pending || socket.disconnected) return;
    input.value = "";
    autosize();
    pending = true;
    setReady(false);
    addMessage("user", value);
    currentText = "";
    current = addMessage("assistant", "");
    current.querySelector(".content").classList.add("cursor");
    phasePill.textContent = "queued";
    socket.emit("message", value);
  }

  function autosize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 180) + "px";
  }

  socket.on("connect", () => {
    setStatus("connected", "Connected", "local web gateway");
    setReady(!pending);
    loadStatus();
  });
  socket.on("disconnect", () => {
    setStatus("disconnected", "Disconnected", "waiting for gateway");
    setReady(false);
  });
  socket.on("connect_error", () => {
    setStatus("disconnected", "Connection failed", "start ntox gateway web");
    setReady(false);
  });
  socket.on("event", (event) => {
    if (event.type === "phase") phasePill.textContent = event.phase || "working";
    if (event.type === "memory") memoryPill.textContent = `${event.action || "memory"} ${event.count || ""}`.trim();
    addActivity(eventLabel(event), event.type === "tool_result" ? (event.success ? "ok" : "fail") : "");
  });
  socket.on("token", (data) => {
    if (!current) current = addMessage("assistant", "");
    const content = current.querySelector(".content");
    if (data.done) {
      currentText = data.full || currentText;
      content.innerHTML = renderText(currentText);
      content.classList.remove("cursor");
      current = null;
      pending = false;
      phasePill.textContent = "idle";
      setReady(true);
      scrollDown();
      return;
    }
    currentText += data.text || "";
    content.innerHTML = renderText(currentText);
    scrollDown();
  });
  socket.on("error", (data) => {
    addActivity(`<strong>error</strong> ${escapeHtml(data.text || "unknown")}`, "fail");
    if (current) current.querySelector(".content").classList.remove("cursor");
    current = null;
    pending = false;
    phasePill.textContent = "idle";
    setReady(true);
  });

  async function loadStatus() {
    try {
      const res = await fetch("/status.json");
      if (!res.ok) return;
      const status = await res.json();
      document.getElementById("model").textContent = status.model || "unknown";
      document.getElementById("provider").textContent = status.provider || "unknown";
      document.getElementById("workspace").textContent = status.profile?.name || "local";
      document.getElementById("session").textContent = `${status.sessions?.sessions || 0} active session${status.sessions?.sessions === 1 ? "" : "s"}`;
    } catch {}
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    submit();
  });
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      submit();
    }
  });
  input.addEventListener("input", autosize);
  document.querySelectorAll(".prompt").forEach((button) => button.addEventListener("click", () => submit(button.textContent)));
  document.getElementById("new-chat").addEventListener("click", () => {
    submit("/new");
    side.classList.remove("open");
  });
  document.getElementById("clear").addEventListener("click", () => {
    [...messages.querySelectorAll(".message")].forEach((node) => node.remove());
    messages.appendChild(empty);
  });
  document.getElementById("theme").addEventListener("click", () => {
    app.dataset.theme = app.dataset.theme === "dark" ? "light" : "dark";
  });
  document.getElementById("menu").addEventListener("click", () => side.classList.toggle("open"));
  thread.addEventListener("click", () => side.classList.remove("open"));
  setStatus("connecting", "Connecting", "local web gateway");
})();
</script>
</body>
</html>
